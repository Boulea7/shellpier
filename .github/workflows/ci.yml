name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  minimum-go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -timeout 5m ./...
      - run: go build ./cmd/shellpier
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...
      - run: go test -json -count=10 -timeout 10m ./...
      - run: go build -o shellpier-smoke${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/shellpier
      - if: runner.os != 'Windows'
        run: ./shellpier-smoke version && ./shellpier-smoke doctor --json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./shellpier-smoke.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./shellpier-smoke.exe doctor --json
          exit $LASTEXITCODE
      - if: runner.os == 'Linux'
        name: Fish completion syntax and candidates
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fish
          ./shellpier-smoke completion fish > "$RUNNER_TEMP/shellpier-completion.fish"
          fish -n "$RUNNER_TEMP/shellpier-completion.fish"
          fish -c '
            source $argv[1]
            function assert_candidate --argument-names command_line expected
              set -l candidates (complete -C "$command_line")
              if not contains -- "$expected" $candidates
                printf "Missing candidate %s for: %s\n" "$expected" "$command_line" >&2
                printf "Candidates: %s\n" $candidates >&2
                exit 1
              end
            end
            assert_candidate "shellpier co" connect
            assert_candidate "shellpier ke" keygen
            assert_candidate "shellpier.exe co" connect
            assert_candidate "shellpier completion po" powershell
            assert_candidate "shellpier --json te" terminal
            assert_candidate "shellpier --json terminal wr" write
            assert_candidate "shellpier --json terminal write --te" --text
            assert_candidate "shellpier files read --off" --offset
            assert_candidate "shellpier terminal write --text read --sta" --state
            assert_candidate "shellpier exec --command -- --cw" --cwd
            if contains -- --command (complete -C "shellpier exec ticket -- --co")
              echo "Local options leaked into a remote command" >&2
              exit 1
            end
          ' "$RUNNER_TEMP/shellpier-completion.fish"
      - if: runner.os == 'Windows'
        name: Legacy Windows contracts and syntax (modern runner)
        shell: pwsh
        run: |
          ./legacy/tests/core-contract.ps1
          ./legacy/tests/bitvise-contract.ps1
          $files = Get-ChildItem -LiteralPath legacy -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parse failed: $($file.Name)" }
          }
      - run: python scripts/validate_skills.py
      - run: python scripts/validate_docs.py
  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
